// Hàm tráo đổi mảng ngẫu nhiên (Fisher-Yates)
function shuffleArray(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

        return;

    currentQuestions = shuffledQ.map(qObj => {
        let optionsMapped = qObj.opts.map((optText, idx) => ({
            text: optText,
            isCorrect: idx === qObj.ans
        }));
        let shuffledOpts = shuffleArray(optionsMapped);
        let correctText = qObj.opts[qObj.ans];

        return {
            q: qObj.q,
            opts: shuffledOpts,
            correctText: correctText
        };
    });

    document.getElementById("playerBadge").textContent = "👤 " + playerName + " · " + playerTeam;
    document.getElementById("startPage").style.display = "none";
    document.getElementById("quizPage").style.display = "block";

    renderSlide();
}

// Hiển thị Slide câu hỏi hiện tại
function renderSlide() {
    clearInterval(questionTimer);
    secondsRemaining = 15;
    questionLocked = false;
    const qData = currentQuestions[currentIndex];
    document.getElementById("progressBadge").textContent = `Câu ${currentIndex + 1} / ${currentQuestions.length}`;
    updateTimerDisplay();
    questionTimer = setInterval(() => {
        secondsRemaining--;
        updateTimerDisplay();
        if (secondsRemaining <= 0) {
            clearInterval(questionTimer);
            questionLocked = true;
            autoAdvanceQuestion();
        }
    }, 1000);
    document.getElementById("questionTitle").textContent = `Câu ${currentIndex + 1}: ${qData.q}`;

    const optsContainer = document.getElementById("optionsList");
    optsContainer.innerHTML = qData.opts.map((opt, i) => `
        <label class="option-item">
            <input type="radio" name="quizOption" value="${i}" ${userAnswers[currentIndex] === i ? "checked" : ""}>
            <b>${String.fromCharCode(65 + i)}.</b>&nbsp; ${escapeHtml(opt.text)}
        </label>
    `).join("");

}

function updateTimerDisplay() {
    const badge = document.getElementById("timerBadge");
    if (badge) {
        badge.textContent = `⏱️ ${Math.max(0, secondsRemaining)} giây`;
        badge.style.color = secondsRemaining <= 5 ? "#dc2626" : "#1e40af";
    }
}

function autoAdvanceQuestion() {
    document.getElementById("feedbackModal").style.display = "none";
    currentIndex++;
    if (currentIndex < currentQuestions.length) renderSlide();
    else finishQuiz();
}

// Xử lý khi bấm nút "XÁC NHẬN ĐÁP ÁN"
function submitAnswer() {
    if (questionLocked) return;
    clearInterval(questionTimer);
    questionLocked = true;
    const selected = document.querySelector('input[name="quizOption"]:checked');
    if (!selected) {
        questionLocked = false;
        questionTimer = setInterval(() => {
            secondsRemaining--;
            updateTimerDisplay();
            if (secondsRemaining <= 0) {
                clearInterval(questionTimer);
                questionLocked = true;
                autoAdvanceQuestion();
            }
        }, 1000);
        alert("Vui lòng chọn 1 đáp án!");
        return;
    }

    const selectedIdx = Number(selected.value);
    const currentQ = currentQuestions[currentIndex];

    // Lưu đáp án của câu hiện tại; câu đã qua không thể mở lại.
    userAnswers[currentIndex] = selectedIdx;

    // Tính lại điểm từ toàn bộ các câu đã trả lời để đổi đáp án
    // tránh cộng điểm trùng lặp.
    score = userAnswers.reduce((total, answer, index) => {
        if (answer === null || !currentQuestions[index]) return total;
        return total + (currentQuestions[index].opts[answer]?.isCorrect ? 1 : 0);
    }, 0);

    const isCorrect = currentQ.opts[selectedIdx].isCorrect;

    const modal = document.getElementById("feedbackModal");
    const modalTitle = document.getElementById("modalTitle");
    const modalBody = document.getElementById("modalBody");

    if (isCorrect) {
        modalTitle.textContent = "🎉 CHÍNH XÁC!";
        modalTitle.className = "modal-title correct";
        modalBody.innerHTML = "Chúc mừng bạn đã chọn đáp án đúng và nhận được <b>+1 điểm</b>!";
    } else {
        modalTitle.textContent = "❌ RẤT TIẾC, BẠN ĐÃ TRẢ LỜI SAI!";
        modalTitle.className = "modal-title wrong";
        modalBody.innerHTML = `
            Đáp án đúng của câu này là:<br>
            <div class="correct-ans-highlight">${escapeHtml(currentQ.correctText)}</div>
        `;
    }

    modal.style.display = "flex";
}

// Khóa chức năng quay lại: người chơi không thể mở lại câu trước.
function previousQuestion() { return; }

// Chuyển sang câu tiếp theo hoặc hoàn thành bài thi
function nextQuestion() {
    clearInterval(questionTimer);
    questionLocked = false;
    document.getElementById("feedbackModal").style.display = "none";
    currentIndex++;

    if (currentIndex < currentQuestions.length) {
        renderSlide();
    } else {
        finishQuiz();
    }
}

// Nộp điểm lên Firebase & Hiển thị Bảng xếp hạng
function finishQuiz() {
    clearInterval(questionTimer);
    questionLocked = true;
    if (playerName && playerTeam) {
        localStorage.setItem(getAttemptKey(playerName, playerTeam), "completed");
    }
    document.getElementById("quizPage").style.display = "none";
    document.getElementById("resultPage").style.display = "block";

    document.getElementById("finalResultNotice").innerHTML = 
        `Bạn <b>${escapeHtml(playerName)}</b> đã hoàn thành bài thi với kết quả: <b>${score}/${currentQuestions.length} câu đúng</b>`;

    // Lưu kết quả cá nhân lên Firebase Realtime Database
    const sanitizedKey = playerName.replace(/[.#$\[\]]/g, "_") + "_" + Date.now().toString().slice(-4);
    db.ref("players/" + sanitizedKey).set({
        name: playerName,
        team: playerTeam,
        score: score,
        timestamp: Date.now()
    });

    listenLeaderboard();
}

function showLeaderboardOnly() {
    document.getElementById("startPage").style.display = "none";
    document.getElementById("resultPage").style.display = "block";
    document.getElementById("finalResultNotice").textContent = "Bảng xếp hạng cá nhân trực tuyến";
    rankTab = "teams";
    showRankTab(rankTab);
    listenLeaderboard();
}

function showRankTab(tab) {
    rankTab = tab;
    document.getElementById("teamRankTab").style.opacity = tab === "teams" ? "1" : "0.65";
    document.getElementById("individualRankTab").style.opacity = tab === "individuals" ? "1" : "0.65";
    document.getElementById("rankSectionTitle").textContent = tab === "teams"
        ? "🏅 Xếp hạng tiểu đội" : "👤 Xếp hạng tất cả cá nhân";
    if (window.latestPlayers) renderLeaderboard(window.latestPlayers);
}

function renderLeaderboard(players) {
    const listContainer = document.getElementById("leaderboardList");
    // Chỉ tính và hiển thị tiểu đội đã có ít nhất một lượt thi được lưu.
    // Thành viên trả lời đúng 0 câu vẫn được tính là đã tham gia.
    const totals = {};
    players.forEach(p => {
        const team = p.team || "Chưa phân tiểu đội";
        if (!totals[team]) totals[team] = { points: 0, participants: 0 };
        totals[team].points += Number(p.score || 0);
        totals[team].participants += 1;
    });
    const teams = Object.entries(totals)
        .filter(([team, data]) => data.participants > 0)
        .sort((a,b) => b[1].points - a[1].points || a[0].localeCompare(b[0], 'vi'));
    if (rankTab === "teams") {
        if (!teams.length) {
            listContainer.innerHTML = "<p style='text-align:center;color:#888;'>Chưa có tiểu đội nào tham gia thi.</p>";
            return;
        }
        listContainer.innerHTML = teams.slice(0, 10).map(([team, data], idx) => `
            <div class="rank-item ${idx === 0 ? 'top1' : ''}">
                <div><b>Hạng ${idx + 1}: ${escapeHtml(team)}</b></div>
                <span class="score-badge">${data.points} điểm</span>
            </div>`).join("");
    } else {
        const individuals = [...players].sort((a,b) => Number(b.score || 0) - Number(a.score || 0)
            || Number(a.timestamp || 0) - Number(b.timestamp || 0));
        if (!individuals.length) {
            listContainer.innerHTML = "<p style='text-align:center;color:#888;'>Chưa có lượt thi nào</p>";
            return;
        }
        listContainer.innerHTML = individuals.slice(0, 10).map((p, idx) => `
            <div class="rank-item ${idx === 0 ? 'top1' : ''}">
                <div><b>Hạng ${idx + 1}: ${escapeHtml(p.name || 'Người chơi')}</b><br><small>${escapeHtml(p.team || 'Chưa phân tiểu đội')}</small></div>
                <span class="score-badge">${Number(p.score || 0)}/${masterQuestions.length} câu đúng</span>
            </div>`).join("");
    }
}

function listenLeaderboard() {
    db.ref("players").on("value", snapshot => {
        const data = snapshot.val() || {};
        window.latestPlayers = Object.values(data);
        renderLeaderboard(window.latestPlayers);
    });
}

function getAttemptKey(name, team) {
    const normalizedName = String(name).trim().toLocaleLowerCase("vi").replace(/\\s+/g, " ");
    return "quiz_attempt_" + encodeURIComponent(team + "|" + normalizedName);
}

function goHome() {
    const enteredPassword = prompt("Chỉ ban tổ chức mới được quay về trang chủ để làm lại. Nhập mật khẩu quản trị:");
    if (enteredPassword === null) return;
    if (enteredPassword !== ADMIN_PASSWORD) {
        alert("Mật khẩu không đúng. Bạn không thể làm lại bài thi.");
        return;
    }

    // Xác thực ban tổ chức: cho phép khởi tạo lượt mới trên trình duyệt hiện tại.
    // Không xóa kết quả cũ trên bảng xếp hạng.
    window.organizerRestartAuthorized = true;
    document.getElementById("resultPage").style.display = "none";
    document.getElementById("startPage").style.display = "block";
}

function resetLeaderboard() {
    const enteredPassword = prompt("Chỉ quản trị viên mới được xóa bảng xếp hạng. Nhập mật khẩu quản trị:");
    if (enteredPassword === null) return;
    if (enteredPassword !== ADMIN_PASSWORD) {
        alert("Mật khẩu không đúng. Không thể xóa bảng xếp hạng.");
        return;
    }
    if (confirm("Bạn chắc chắn muốn xóa toàn bộ bảng xếp hạng trên hệ thống? Thao tác này không thể hoàn tác.")) {
        db.ref("players").remove()
          .then(() => alert("Đã xóa bảng xếp hạng thành công."))
          .catch(error => alert("Không thể xóa bảng xếp hạng: " + error.message));
    }
}

function escapeHtml(str) {
    const d = document.createElement("div");
    d.textContent = str;
    return d.innerHTML;
}
</script>
